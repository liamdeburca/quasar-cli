[build-system]
requires = [
    "wheel", 
    "setuptools==72.1.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "quasar-cli"
authors = [{name = "Liam", email = "liam_deburca@me.com"}]
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "quasar-io==0.1.0",

    "pydantic==2.12",
    "lazy-imports==1.2.0",
    "click==8.5.0",
    "scienceplots==2.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "black==26.10.1",
    "isort==9.0.2",
]

[tool.setuptools.package-data]
quasar_cli = ["data/linelist.csv", "data/lookup.csv"]

[project.scripts]
quasar-cli = "quasar_cli.cli.main:cli"

[project.urls]
Repository = "https://github.com/liamdeburca/quasar-cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79

[lint.pyupgrade]
keep-runtime-typing = true